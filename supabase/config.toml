[auth]
additional_redirect_urls = ["cmms://auth/callback"]

[functions.send-reminder]
# The handler validates the user's token with Auth and checks the active admin role.
verify_jwt = false

[functions.staff-login]
# Public password sign-in; the handler uses rate-limited lookup and Supabase Auth.
verify_jwt = false

[functions.student-login]
# Public password sign-in; the handler resolves Student ID server-side.
verify_jwt = false
